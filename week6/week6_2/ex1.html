<!DOCTYPE html>
<html><head>
<style>
  body { font-family: system-ui; padding: 30px; max-width: 400px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 14px; font-weight: 600; color: #374151; }
  input[type="email"], input[type="password"] {
    padding: 10px 14px; border: 2px solid #c8d4f0;
    border-radius: 8px; font-size: 15px; width: 100%;
  }
  input:focus { border-color: #1a56db; outline: none; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  button { background: #1a56db; color: white; border: none;
    padding: 12px; border-radius: 8px; font-size: 15px;
    font-weight: 700; cursor: pointer; }
</style>
</head><body>
  <h2>Sign In</h2>
  <form method="post" action="/login">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="pw">Password</label>
    <input type="password" id="pw" name="password" required>

    <div class="checkbox-row">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember">Remember me</label>
    </div>

    <button type="submit">Sign In</button>
  </form>

</body></html>
