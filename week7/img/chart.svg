<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Bar chart showing student enrollment: 2024: 1,200 students; 2025: 1,400 students; 2026: 1,476 students">
  <!-- Panel -->
  <rect width="640" height="360" fill="#F2F7F3"/>
  <text x="320" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#092328">Student enrollment</text>

  <!-- Axes -->
  <line x1="80" y1="60" x2="80" y2="300" stroke="#092328" stroke-width="2"/>
  <line x1="80" y1="300" x2="580" y2="300" stroke="#092328" stroke-width="2"/>

  <!-- Bars: 1,200 / 1,400 / 1,476 -->
  <rect x="140" y="105" width="90" height="195" fill="#8BBB92"/>
  <rect x="290" y="72" width="90" height="228" fill="#2A835F"/>
  <rect x="440" y="60" width="90" height="240" fill="#12544F"/>

  <!-- Value labels -->
  <text x="185" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#092328">1,200</text>
  <text x="335" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#092328">1,400</text>
  <text x="485" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#092328">1,476</text>

  <!-- Year labels -->
  <text x="185" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#3F5B5C">2024</text>
  <text x="335" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#3F5B5C">2025</text>
  <text x="485" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#3F5B5C">2026</text>
</svg>
