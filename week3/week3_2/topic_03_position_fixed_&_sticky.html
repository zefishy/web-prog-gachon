<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; font-family: sans-serif; }

    
    .fixed-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #0f766e;
      color: white;
      padding: 14px 24px;
      z-index: 100;   
    }

    .content { padding-top: 60px; } 

    
    .sticky-header {
      position: sticky;
      top: 56px;              
      background: #ccfbf1;
      border-left: 4px solid #14b8a6;
      padding: 10px 16px;
      font-weight: bold;
      color: #0f766e;
    }

    .section-body {
      padding: 20px;
      height: 300px;    
      background: #f0fdfa;
    }
  </style>
  <link rel="stylesheet" href="../../css/shared.css">
</head>
<body>
	<button class="back-button" type="button" onclick="history.back()">Back</button>
  <nav class="fixed-nav">Fixed Navigation — always visible while scrolling</nav>
  <div class="content">
    <div>
      <div class="sticky-header">Section A — sticky header</div>
      <div class="section-body">Scroll down to see the sticky header in action…</div>
    </div>
    <div>
      <div class="sticky-header">Section B — another sticky header</div>
      <div class="section-body">Each section has its own sticky label.</div>
    </div>
  </div>
</body>
</html>
