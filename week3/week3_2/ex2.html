<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            padding: 40px;
            background: #f0fdfa;
        }

        .card {
            background: white;
            border: 2px solid #14b8a6;
            border-radius: 12px;
            padding: 24px;
            width: 240px;
            color: #0f766e;
            font-size: 16px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(20, 184, 166, 0.35);
        }
    </style>
</head>

<body>
    <div class="card">Hover over me!</div>
</body>

</html>
