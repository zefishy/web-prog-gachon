<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
        }

        .normal {
            font-weight: normal;
        }

        .bold {
            font-weight: bold;
        }

        .w300 {
            font-weight: 300;
        }

        .w400 {
            font-weight: 400;
        }

        .w500 {
            font-weight: 500;
        }

        .w600 {
            font-weight: 600;
        }

        .w700 {
            font-weight: 700;
        }

        .w900 {
            font-weight: 900;
        }

    </style>
</head>

<body>
    <p class="w300">300 — Light</p>
    <p class="w400">400 — Regular (normal)</p>
    <p class="w500">500 — Medium</p>
    <p class="w600">600 — SemiBold</p>
    <p class="w700">700 — Bold</p>
    <p class="w900">900 — Black</p>
</body>

</html>
