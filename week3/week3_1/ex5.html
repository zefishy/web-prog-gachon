<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: sans-serif; /* 1: semicolon */
            background-color: #f0fdf4;
        }

        h1 {
            color: #15803d; /* 2: = into : */
            font-size: 2rem;
            text-align: center; /* 3: colon */
        }

        p {
            line-height: 1.7;
            color: #334155; /* fix 4: foreground into color */
        }

        /* This is a correct CSS comment */
        /* fix 5: fixed comment */
        */ .highlight {
            background-color: #dcfce7;
        }
    </style>
</head>

<body>
    <h1>Fixed!</h1>
    <p>This paragraph has <span class="highlight">working CSS</span> around it.</p>
</body>

</html>
