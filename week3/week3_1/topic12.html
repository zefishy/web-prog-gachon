<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        html {
            font-size: 100%;
        }

        .px-example {
            font-size: 18px;
        }

        .rem-example {
            font-size: 1.5rem;
        }
        .parent {
            font-size: 20px;
        }

        .child-em {
            font-size: 1.5em;
        }

        .scale-sm {
            font-size: 0.875rem;
        }
        .scale-base {
            font-size: 1rem;
        }

        .scale-lg {
            font-size: 1.25rem;
        }

        .scale-xl {
            font-size: 1.5rem;
        }

        .scale-2xl {
            font-size: 2rem;
        }

    </style>
</head>

<body>
    <p class="scale-sm">0.875rem — small text</p>
    <p class="scale-base">1rem — base body text</p>
    <p class="scale-lg">1.25rem — large text</p>
    <p class="scale-xl">1.5rem — extra large</p>
    <p class="scale-2xl">2rem — heading size</p>
</body>

</html>
