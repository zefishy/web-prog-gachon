<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        .ex1 {
            background-color: rgb(255, 0, 0);
            color: white;
        }

        .ex2 {
            background-color: rgb(21, 128, 61);
            color: white;
        }

        .ex3 {
            background-color: rgb(29, 78, 216);
            color: white;
        }

        .ex4 {
            background-color: rgb(100, 100, 100);
            color: white;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 20px;
        }

        .glass {
            background-color: rgba(21, 128, 61, 0.15);
            border: 1px solid rgba(21, 128, 61, 0.4);
            padding: 12px;
        }

        div {
            padding: 8px 16px;
            margin: 6px;
        }
    </style>
</head>

<body>
    <div class="ex1">rgb(255, 0, 0) — Red</div>
    <div class="ex2">rgb(21, 128, 61) — Green</div>
    <div class="ex3">rgb(29, 78, 216) — Blue</div>
    <div class="ex4">rgb(100, 100, 100) — Grey</div>
    <div class="overlay">rgba(0,0,0,0.5) — 50% black overlay</div>
    <div class="glass">rgba green 15% — glassmorphism card</div>
</body>

</html>
